name: Import portrait ZIPs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract and validate portrait archives
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path, PurePosixPath

          archives = [Path("portrait-part-1.zip"), Path("portrait-part-2.zip")]
          for archive in archives:
              if not archive.is_file():
                  raise SystemExit(f"Missing archive: {archive.name}")

          output = Path("assets/portraits")
          output.mkdir(parents=True, exist_ok=True)
          allowed = {".png", ".jpg", ".jpeg", ".webp"}
          extracted = []
          seen = set()

          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      p = PurePosixPath(info.filename)
                      if p.suffix.lower() not in allowed:
                          continue
                      name = p.name
                      if not name or name in seen or (output / name).exists():
                          raise SystemExit(f"Duplicate image filename: {name}")
                      seen.add(name)
                      data = z.read(info)
                      (output / name).write_bytes(data)
                      extracted.append({
                          "file": name,
                          "sourceArchive": archive.name,
                          "bytes": len(data)
                      })

          if not extracted:
              raise SystemExit("No PNG/JPG/JPEG/WEBP images found in the ZIP archives.")

          (output / "manifest.json").write_text(
              json.dumps({
                  "source": "user-uploaded ZIP archives",
                  "imageCount": len(extracted),
                  "images": extracted
              }, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )

          print(f"Extracted images: {len(extracted)}")
          print(f"Archive 1: {sum(x['sourceArchive'] == archives[0].name for x in extracted)}")
          print(f"Archive 2: {sum(x['sourceArchive'] == archives[1].name for x in extracted)}")

          for archive in archives:
              archive.unlink()
          PY

      - name: Commit extracted portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits portrait-part-1.zip portrait-part-2.zip
          git commit -m "Import Blue Archive portrait images"
          git push
