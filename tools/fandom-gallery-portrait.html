<h1>Fandom Gallery 기반 포트레이트 수집</h1>
<p>기준 명단 203명과 Fandom에서 각 캐릭터 이름으로 Gallery 문서를 직접 검색하고, 문서 안에서 기본(Default) 구역의 Portrait 이미지를 우선 추출합니다. 존재하지 않는 Category:Gallery 분류에 의존하지 않습니다.</p>
<p class="note"><b>주의:</b> 자동 이름 대조는 후보를 찾는 단계입니다. 유사도가 낮거나 기본 이미지 영역을 특정하지 못한 항목은 자동 확정하지 않습니다. 최종 선택 전에 미리보기를 확인해 주세요.</p>
<div class="bar"><button id="run">Gallery 대조 및 이미지 조회</button><button id="select">확실한 후보 선택</button><button id="clear">선택 해제</button><button id="download" disabled>선택 이미지 다운로드</button></div>
<div id="status" class="status">대기 중입니다.</div><div id="results"></div>

async function api(p){const u=new URL(API);for(const [k,v] of Object.entries({...p,origin:'*',format:'json'}))u.searchParams.set(k,v);const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
function romanizeHangul(str){
 const onset=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
 const vowel=['a','e','ya','ye','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
 const coda=['','k','k','ks','n','nj','nh','t','l','lk','lm','lb','ls','lt','lp','lh','m','p','ps','t','t','ng','t','t','k','t','p','t'];
 let out='';
 for(const ch of str.replace(/[()（）]/g,' ').replace(/테러/g,'테러')){
  const code=ch.charCodeAt(0)-44032;
  if(code<0||code>11171){out+=ch;continue;}
  const a=Math.floor(code/588),v=Math.floor((code%588)/28),c=code%28;
  let ini=onset[a],vv=vowel[v],fin=coda[c];
  if(a===9&&v===20)ini='j'; // ㅅ + ㅟ -> swi approximation
  if(a===9&&v===20)vv='wi';
  if(a===9&&v===6)ini='sh';
  if(a===9&&v===20)ini='sh';
  if(a===12&&v===6)ini='j';
  if(a===14&&v===18)ini='ch';
  if(a===14&&v===18)vv='u';
  if(a===14&&v===6)ini='ch';
  if(a===14&&v===6)vv='i';
  if(a===14&&v===8){ini='ts';vv='u';}
  if(a===9&&v===8)ini='s';
  if(a===12&&v===8)ini='z';
  if(a===12&&v===6)vv='i';
  if(a===9&&v===6)vv='i';
  out+=ini+vv+fin;
 }
 return out.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

사키 코유키':'kurosaki koyuki','쿠와카미 카호':'kuwakami kaho','키류 키쿄':'kiryuu kikyou','키리후지 나기사':'kirifuji nagisa','텐도 아리스':'tendou aris','텐진야마 오토기':'tenjin yamato','토요미 코토리':'toyomi kotori','하네카와 하스미':'hanekawa hasumi','하야세 유우카':'hayase yuuka','하카리 아츠코':'hakari atsuko','후와 렌게':'fuwa renge','후치가미 코토네':'fuchigami kotone','히노미야 치나츠':'hinomiya chinatsu','프라나':'plana','총학생회장':'gsc president','나나가미 린':'nanagami rin','유라키 모모카':'yuraki momoka','하이네':'haine','스모모':'sumomo','스나오오카미 시로코(테러)':'sunaookami shiroko terror','이가라시 쇼코':'igarashi shoko','쿠즈노하':'kuzunoha','코쿠리코':'kadenokouji kokuriko','야부키 슈로':'yabuki shuro','하부 아자미':'habu azami','미야우치 카나에':'miyauchi kanae','칸바라 미스즈':'kanbara misuzu','시치도 유키노':'shichido yukino','아사기리 스오우':'asagiri suou','우미지 미나토':'umiji minato','후나모리 사나에':'funamori sanae','마키나':'makina','사유리':'sayuri','카자카미 마이':'kazemaki mai','카와루 시논':'kawaru shinon','히죽히죽 교수':'professor giggles','타카노스 스이코':'takanosu suiko','우토 요코':'uto yoko','말쿠트':'malkuth','소프':'soph','오르':'ohr','히무로 세나':'himuro sena','쿠치나시 유메':'kuchinashi yume','아인':'ein','요시노 니코':'niko','츠치나가 히요리':'tsuchinaga hiyori'
};
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'');}
function lev(a,b){const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const tmp=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp;}}return d[b.length];}
function score(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length);}
function render(){ $('results').innerHTML=rows.map((x,i)=>`<div class="item"><input type="checkbox" data-i="${i}" ${x.selected?'checked':''} ${x.url?'':'disabled'}><div>${x.url?`<img src="${x.thumb||x.url}" alt="">`:'<span class="muted">이미지 없음</span>'}</div><div><b>${x.name}</b><br><span class="tag">${x.affiliation}</span><br><small class="muted">검색명: ${x.roman}</small></div><div class="candidate">${x.page?`<a target="_blank" rel="noopener" href="https://bluearchive.fandom.com/wiki/${encodeURIComponent(x.page.replace(/ /g,'_'))}">${x.page}</a> · 일치도 ${Math.round(x.score*100)}%<br>${x.file||'Portrait 후보를 못 찾음'}`:x.error||'Gallery 문서 후보 없음'}</div></div>`).join('');$('download').disabled=!rows.some(x=>x.selected&&x.url);}
$('results').addEventListener('change',e=>{if(e.target.matches('input[type=checkbox]')){rows[+e.target.dataset.i].selected=e.target.checked;$('download').disabled=!rows.some(x=>x.selected&&x.url);}});
async function findGalleryPage(roman){
 const exact=roman.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')+'/Gallery';
 const direct=await api({action:'query',titles:exact,prop:'info'});
 const directPage=Object.values(direct.query?.pages||{})[0];
 if(directPage&&!directPage.missing)return exact.replace(/\/Gallery$/i,'');
 for(const q of [roman+' Portrait',roman+' Gallery',roman]){
  const d=await api({action:'query',list:'search',srnamespace:0,srsearch:q,srlimit:12});
  const hits=d.query?.search||[];
  const gallery=hits.find(h=>/\/Gallery$/i.test(h.title));
  if(gallery)return gallery.title.replace(/\/Gallery$/i,'');
  const character=hits.find(h=>norm(h.title)===norm(roman)||norm(h.title).includes(norm(roman)));
  if(character)return character.title;
 }
 return null;
}
async function galleryPortrait(title,roman){
 const preferred=title==='Kosaka Wakamo'?['Portrait (Unmask)','Portrait']:['Portrait'];
 async function imageInfoFromItem(item,label){
   // 넓은 부모에 Icon과 Portrait가 함께 있을 수 있으므로, 파일명에 Portrait가 명시된 이미지부터 찾는다.
   const candidates=[];
   for(const img of [...item.querySelectorAll('img')]){
     const metadata=[img.getAttribute('data-image-name'),img.getAttribute('data-file-name'),img.getAttribute('alt'),img.getAttribute('title')].filter(Boolean);
     const src=img.getAttribute('data-src')||img.getAttribute('src')||'';
     const srcMatch=src.match(/\/([^/?#]+\.(?:png|jpg|jpeg|webp))(?:[/?#]|$)/i);
     if(srcMatch)metadata.push(decodeURIComponent(srcMatch[1]));
     const link=img.closest('a[href]');
     const href=link?.getAttribute('href')||'';
     const fileMatch=href.match(/(?:File:|Special:Redirect\/file\/)([^?#]+)/i);
     if(fileMatch)metadata.push(decodeURIComponent(fileMatch[1].replace(/_/g,' ')));
     const file=metadata.find(v=>/portrait/i.test(v)&&/\.(?:png|jpg|jpeg|webp)(?:$|[?#])/i.test(v))||metadata.find(v=>/\.(?:png|jpg|jpeg|webp)(?:$|[?#])/i.test(v))||'';
     if(!file||/\bicon\b/i.test(file)||!/portrait/i.test(file))continue;
     candidates.push({file:file.replace(/^File:/i,'').trim()});
   }
   // img와 분리된 파일 링크도 보조적으로 확인한다.
   if(!candidates.length){
     for(const a of [...item.querySelectorAll('a[href*="File:"]')]){
       const m=(a.getAttribute('href')||'').match(/File:([^?#]+)/i);
       if(m){
         const file=decodeURIComponent(m[1].replace(/_/g,' '));
         if(/portrait/i.test(file)&&!/\bicon\b/i.test(file))candidates.push({file});
       }
     }
   }
   for(const candidate of candidates){
     const info=await api({action:'query',prop:'imageinfo',iiprop:'url|size|mime',iiurlwidth:180,titles:'File:'+candidate.file});
     const imagePage=Object.values(info.query?.pages||{})[0],ii=imagePage?.imageinfo?.[0];
     if(ii)return {file:candidate.file,url:ii.url,thumb:ii.thumburl||ii.url,width:ii.width,height:ii.height,matchType:label};
   }
   return null;
 }
 function normLabel(s){return (s||'').replace(/\[\s*\]/g,'').replace(/\s+/g,' ').trim().toLowerCase();}
 async function extractFromHtml(html,mode){
   if(!html)return null;
   const doc=new DOMParser().parseFromString(html,'text/html');
   let root=doc;
   if(mode==='gallery'){
     const headings=[...doc.querySelectorAll('h2,h3,h4,h5,h6')];
     const headingText=h=>{const c=h.cloneNode(true);c.querySelectorAll('.mw-editsection,.editsection').forEach(e=>e.remove());return normLabel(c.textContent);};
     const defaultHeading=headings.find(h=>headingText(h)==='default');
     if(defaultHeading){
       const level=Number(defaultHeading.tagName.slice(1)),section=[];
       for(let node=defaultHeading.nextElementSibling;node;node=node.nextElementSibling){
         if(/^H[2-6]$/.test(node.tagName)&&Number(node.tagName.slice(1))<=level)break;
         section.push(node);
       }
       root=document.createElement('div');section.forEach(node=>root.append(node.cloneNode(true)));
     }
   }
   const selectors='figure,.gallerybox,.wikia-gallery-item,.gallery-item,li,div,span';
   const nodes=[...root.querySelectorAll(selectors)];
   for(const wanted of preferred){
     const matches=nodes.filter(item=>{
       const caption=item.querySelector('figcaption,.gallerytext,.lightbox-caption,.caption')||item;
       return normLabel(caption.textContent)===wanted.toLowerCase() && item.querySelector('img,a[href*="File:"]');
     });
     for(const item of matches){
       const result=await imageInfoFromItem(item,wanted);
       if(result)return result;
     }
   }
   // Overview pages often place the label and image in adjacent infobox/tab markup rather than a gallery figure.
   if(mode==='overview'){
     const labels=[...root.querySelectorAll('*')].filter(el=>el.children.length===0&&preferred.some(p=>normLabel(el.textContent)===p.toLowerCase()));
     for(const label of labels){
       let parent=label;
       for(let depth=0;depth<7&&parent;depth++,parent=parent.parentElement){
         if(parent.querySelector('img,a[href*="File:"]')){
           const result=await imageInfoFromItem(parent,normLabel(label.textContent));
           if(result)return result;
         }
       }
     }
     const anchors=[...root.querySelectorAll('a[href*="File:"]')];
     for(const a of anchors){
       let parent=a;
       for(let depth=0;depth<6&&parent;depth++,parent=parent.parentElement){
         const txt=normLabel(parent.textContent);
         if(txt==='portrait'||txt.startsWith('portrait ')){
           const result=await imageInfoFromItem(parent,'Overview / Portrait');
           if(result)return result;
         }
       }
     }
     // Some overview infoboxes expose the image label only through img alt/title metadata.
     const portraitImages=[...root.querySelectorAll('img')].filter(img=>{
       const label=[img.getAttribute('alt'),img.getAttribute('title'),img.getAttribute('data-image-name'),img.getAttribute('data-file-name')].join(' ');
       return /portrait/i.test(label)&&!/expression|swimsuit|new year|kimono|miko/i.test(label);
     });
     for(const img of portraitImages){
       const result=await imageInfoFromItem(img.parentElement||img,'Overview / Portrait (image metadata)');
       if(result)return result;
     }
   }
   return null;
 }
 // First try the Gallery page. If it has no Gallery section/portrait, fall back to the character overview page.
 try{
   const parsed=await api({action:'parse',page:title+'/Gallery',prop:'text'});
   const html=parsed.parse?.text?.['*'];
   const found=await extractFromHtml(html,'gallery');
   if(found)return found;
 }catch(e){}
 try{
   const parsed=await api({action:'parse',page:title,prop:'text'});
   const html=parsed.parse?.text?.['*'];
   const found=await extractFromHtml(html,'overview');
   if(found)return found;
 }catch(e){}
 return null;
}
$('run').onclick=async()=>{
 $('run').disabled=true;rows=[];$('results').replaceChildren();
 try{
  say('기준 명단과 Fandom Gallery 분류를 불러오는 중…');
  const [rd,nd]=await Promise.all([fetch(ROSTER).then(r=>{if(!r.ok)throw Error('기준 명단을 불러오지 못했습니다.');return r.json();}),fetch(NAME_OVERRIDES).then(r=>{if(!r.ok)throw Error('영문 이름 대응표를 불러오지 못했습니다.');return r.json();})]);
  const entries=rd.entries,nameOverrides=nd.overrides||{},unresolved=nd.unresolved||{};rows=entries.map(e=>({...e,roman:nameOverrides[e.name]||aliases[e.name]||romanizeHangul(e.name),unresolved:unresolved[e.name]||'',page:null,score:0,url:null,selected:false,error:unresolved[e.name]?'영문 문서명 미확정 · 외부 출처 확인 필요':'검색 대기'}));
  render();let idx=0,done=0;
  say('캐릭터별 Gallery 문서를 직접 검색합니다.\\n0/'+rows.length+'명');
  async function worker(){while(idx<rows.length){const i=idx++,x=rows[i];try{
    if(x.unresolved){done++;say('캐릭터별 Gallery 확인: '+done+'/'+rows.length+'명\\n이미지 후보 '+rows.filter(z=>z.url).length+'개 · 외부 출처 확인 필요 '+rows.filter(z=>z.unresolved).length+'개');render();continue;}
    const page=await findGalleryPage(x.roman);
    if(page){x.page=page;x.score=score(x.roman,page.replace(/\/Gallery$/i,''));const p=await galleryPortrait(page,x.roman);if(p)Object.assign(x,p);else x.error='기본 Portrait 파일명과 정확히 일치하는 후보 없음 (다른 복장 오인 방지를 위해 제외)';}
    else x.error='Gallery 문서 검색 결과 없음';
   }catch(e){x.error='조회 오류: '+e.message;}
   done++;say('캐릭터별 Gallery 확인: '+done+'/'+rows.length+'명\\n이미지 후보 '+rows.filter(z=>z.url).length+'개 · 추가 확인 '+rows.filter(z=>!z.url).length+'개');render();await sleep(250);
  }}
  await Promise.all(Array.from({length:3},worker));
  say('완료: '+done+'/'+rows.length+'명\n이미지 후보 '+rows.filter(x=>x.url).length+'개. 일치도와 미리보기를 확인하고 선택해 주세요.');
 }catch(e){say('오류: '+e.message);}
 finally{$('run').disabled=false;}
};
$('select').onclick=()=>{rows.forEach(x=>{if(x.url&&x.score>=0.9)x.selected=true;});render();};
$('clear').onclick=()=>{rows.forEach(x=>x.selected=false);render();};
$('download').onclick=async()=>{const selected=rows.filter(x=>x.selected&&x.url);$('download').disabled=true;let n=0;for(const x of selected){try{const r=await fetch(x.url);if(!r.ok)throw Error();const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=x.file.replace(/[^a-z0-9._-]/gi,'_');document.body.append(a);a.click();a.remove();URL.revokeObjectURL(u);n++;}catch(e){window.open(x.url,'_blank','noopener');}say('다운로드 요청 '+n+'/'+selected.length);await sleep(400);}say('다운로드 요청 완료 '+n+'/'+selected.length+'. 브라우저 다운로드 목록에서 저장 여부를 확인해 주세요.');$('download').disabled=false;};
</script></body></html>
